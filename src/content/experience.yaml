- id: fullstack-labs-ror-js
  company: FullStack Labs
  role:
    en: Full-Stack Software Engineer (RoR, JS)
    es: Ingeniero de Software Full-Stack (RoR, JS)
  type: full-time
  location:
    en: United States
    es: Estados Unidos
  start: '2024-05'
  end: '2025-02'
  highlights:
    en:
      - Built from scratch the Apache Kafka integration that queues donation
        notifications for the chairpersons and administrators of WiddyUp, a
        platform for school fundraising campaigns, replacing the Active Job
        background job.
      - Ran a critical, system-wide migration from the Pagy gem to
        will_paginate to fix a compatibility problem with Rails 6.1,
        refactoring the pagination logic in about 8 controllers and 12 views
        and securing the change with RSpec tests.
      - Co-developed the model and the reversible migrations for
        customizable categories, which let chairpersons group and filter a
        campaign's students by what they had to present in their videos.
      - Built the HTML and JSON endpoints for the categories on the same
        controllers, and added the categories to the paginated table of the
        chairperson dashboard with Hotwire and Stimulus.
      - Implemented the new five-page onboarding in which a chairperson sets
        up a whole campaign (location, school, fundraising goal), building
        the interfaces designed in Figma with Hotwire, Stimulus and vanilla
        JavaScript.
      - Extended the existing Stripe integration with a webhook that
        confirms payment operations and error handling that gives the user
        feedback, and redesigned the payment form from Figma designs.
      - Edited and created three email templates (donation confirmation,
        onboarding and reminders) with Rails utilities and the existing
        Twilio integration.
      - Resolved five to seven support tickets a week reported by users,
        shipping hotfixes and correcting data created by platform bugs.
    es:
      - Construyó desde cero la integración con Apache Kafka que encola las
        notificaciones de donaciones para los chairpersons y administradores
        de WiddyUp, una plataforma de campañas escolares de recaudación de
        fondos, reemplazando el job en segundo plano con Active Job.
      - Ejecutó una migración crítica en todo el sistema de la gema Pagy a
        will_paginate para resolver un problema de compatibilidad con Rails
        6.1, refactorizando la lógica de paginación en aproximadamente 8
        controladores y 12 vistas y asegurando la transición con pruebas en
        RSpec.
      - Co-desarrolló el modelo y las migraciones reversibles de las
        categorías personalizables, que permitieron a los chairpersons
        agrupar y filtrar a los estudiantes de una campaña según lo que
        debían presentar en sus videos.
      - Desarrolló los endpoints HTML y JSON de las categorías reutilizando
        los mismos controladores, y agregó las categorías a la tabla
        paginada del dashboard del chairperson con Hotwire y Stimulus.
      - Implementó el nuevo proceso de onboarding de cinco páginas en el que
        un chairperson configura toda la campaña (ubicación, escuela, monto
        objetivo), creando las interfaces diseñadas en Figma con Hotwire,
        Stimulus y JavaScript vanilla.
      - Extendió la integración existente con Stripe con un webhook para
        confirmar operaciones de pago y un manejo de errores que muestra
        feedback al usuario, y rediseñó el formulario de pago a partir de
        diseños en Figma.
      - Editó y generó tres plantillas de email (confirmación de donación,
        onboarding y recordatorios) con las utilidades de Rails y la
        integración existente con Twilio.
      - Resolvió de cinco a siete tickets de soporte por semana reportados
        por usuarios, generando hotfixes y corrigiendo datos creados por
        bugs de la plataforma.
  stack:
    - Ruby on Rails
    - Hotwire
    - Stimulus
    - RSpec
    - Apache Kafka
    - Stripe
    - Twilio
    - Docker
    - AWS EC2
    - JavaScript
    - Figma

- id: techywe-js-ts
  company: TechyWe
  role:
    en: Mid-level Full-Stack Developer (JS, TS)
    es: Desarrollador Full-Stack de nivel medio (JS, TS)
  type: full-time
  location:
    en: El Salvador
    es: El Salvador
  start: '2023-07'
  end: '2024-04'
  highlights:
    en:
      - Designed and implemented an event-driven microservice for Belize
        Bank Limited's Wire Transfer, Secured Loan and Unsecured Loan
        projects, to communicate with the client's existing reverse proxy,
        which orchestrated all its other microservices.
      - Designed and implemented the endpoints the front end consumes,
        applying the Builder pattern so a transaction can be built step by
        step and, when needed, taken apart.
      - Implemented the LoopBack connector in the services that talk to the
        client's SOAP API, built on a DB2 database.
      - Implemented a two-token authentication system, with a login token
        for session handling and an OTP confirmation token to strengthen
        security in critical operations.
      - Refactored existing services, controllers and routes for
        readability, maintainability and performance following practices
        such as SOLID, which significantly cut ticket resolution times
        because technical debt weighed heavily on estimates.
      - Wrote integration tests with LoopBack's test suite (Mocha, testlab),
        focused on authentication and on guaranteeing the creation of
        unsecured loans.
      - Guided, reviewed and gave feedback to the team behind the
        secured-loan project so it followed the Strategy, Factory and
        Decorator patterns that LoopBack is built on.
      - Designed and implemented the MySQL tables for international
        transfers, secured loans and unsecured-loan applications, and
        integrated them with the client's existing tables to make
        information easier to reuse.
      - Provided ongoing support and maintenance after the unsecured-loan
        module went live, handling production incidents and shipping
        improvements.
    es:
      - Diseñó e implementó un microservicio orientado a eventos para los
        proyectos Wire Transfer, Secured Loan y Unsecured Loan de Belize
        Bank Limited, para comunicarse con el reverse proxy existente del
        cliente, que orquestaba todos sus demás microservicios.
      - Diseñó e implementó los endpoints requeridos para el consumo del
        front-end, aplicando el patrón Builder para permitir la construcción
        paso a paso de la transacción y, de ser necesario, su
        deconstrucción.
      - Implementó el conector de LoopBack en los servicios responsables de
        comunicarse con la API SOAP del cliente, construida sobre una base
        de datos DB2.
      - Implementó un sistema de autenticación de doble token, con un token
        de login para el manejo de sesión y un token de confirmación OTP
        para reforzar la seguridad en operaciones críticas.
      - Refactorizó servicios, controladores y rutas existentes para mejorar
        legibilidad, mantenibilidad y rendimiento siguiendo buenas prácticas
        como SOLID, lo que redujo significativamente los tiempos de
        resolución de tickets, ya que la deuda técnica era un factor clave
        en las estimaciones.
      - Desarrolló pruebas de integración con la suite de pruebas de
        LoopBack (Mocha, testlab), enfocadas en la autenticación y en
        garantizar la creación de préstamos sin garantía.
      - Guio, revisó y dio feedback al equipo responsable del proyecto de
        préstamos con garantía para asegurar que siguiera los patrones
        Strategy, Factory y Decorator, base del framework LoopBack.
      - Diseñó e implementó las tablas MySQL para transferencias
        internacionales, préstamos con garantía y solicitudes de préstamos
        sin garantía, y las integró con las tablas existentes del cliente
        para facilitar la reutilización de información.
      - Brindó soporte y mantenimiento continuo tras el despliegue del
        módulo de préstamos sin garantía, atendiendo incidencias en
        producción e implementando mejoras.
  stack:
    - LoopBack 4
    - TypeScript
    - MySQL
    - Postman
    - SSH
    - Azure DevOps


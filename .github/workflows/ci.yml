name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # CLOUDFLARE_ENV=e2e makes the Cloudflare plugin read .dev.vars.e2e (fake and test
      # values, fake provider URLs) when it builds, and bake it into dist/server/.dev.vars,
      # which the e2e step's preview server reads. This build is for the e2e step only:
      # nothing here is deployed (Cloudflare builds the deployed Worker itself). Without the
      # variable the e2e run stops before the first test (e2e/support/hermetic-guard.ts).
      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_ENV: e2e

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
